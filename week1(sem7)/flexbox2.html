<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Oxygen:wght@300;400;700&display=swap"
        rel="stylesheet">
    <title>Navigation Bar</title>
    <style>
        body {
            background-color: rgb(247, 244, 238);
        }

        header {
            font-family: "Archivo", sans-serif;
            display: flex;
            justify-content: space-between;
            /* 左中右分布 */
            align-items: center;
            background-color: white;
            padding: 10px 40px;
            /* 上下左右间距 */

        }

        /* === logo部分 === */
        .logo img {
            height: 55px;
        }

        /* === 导航菜单 === */
        .menu {
            display: flex;
            gap: 30px;
            /* 菜单之间的间距 */
        }

        .menu a {
            text-decoration: none;
            color: black;
            font-size: 15px;
            transition: color 0.3s;
            font-weight: 500;
        }

        .menu a:hover {
            color: orange;
        }


        .right-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .phone {
            font-weight: bold;
        }

        .contact-btn {
            background-color: #ff6a33;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-btn:hover {
            background-color: #e55b25;
        }
    </style>
</head>

<body>
    <header>

        <div class="logo">
            <img src="image/logo.png" alt="ELEMENTRA">
        </div>


        <nav class="menu">
            <a href="#">Home</a>
            <a href="#" style="color: orange;">Services</a>
            <a href="#">Work</a>
            <a href="#">Project Details</a>
            <a href="#">Contact</a>
        </nav>


        <div class="right-section">
            <div class="phonepic">
                <img src="image/phone-call.png" alt="contact" height="20">
            </div>
            <div class="phone">555-123-4567</div>
            <a href="#" class="contact-btn">Contact</a>
        </div>
    </header>
</body>

</html>
