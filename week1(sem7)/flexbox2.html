<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Oxygen:wght@300;400;700&display=swap"
        rel="stylesheet">
    <title>Navigation Bar</title>
    <style>
        body {
            background-color: rgb(247, 244, 238);
            margin-top: 0;
            margin: 0;
        }

        header {
            font-family: "Archivo", sans-serif;
            display: flex;
            justify-content: space-between;
            /* 左中右分布 */
            align-items: center;
            background-color: white;
            padding: 10px 30px;
            z-index: 100;
            position: relative;
            /* 上下左右间距 */


        }


        .logo img {
            height: 55px;
        }

        /* === navbar === */
        .menu {
            display: flex;
            gap: 30px;
            /* menu之间的间距 */
        }

        .menu a {
            text-decoration: none;
            color: black;
            font-size: 16px;
            transition: color 0.3s;
            font-weight: 500;
        }

        .menu a:hover {
            color: #F9612B;
            ;
        }


        .right-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .phone {
            font-size: 16px;
            font-weight: bold;

        }

        .contact-btn {
            background-color: #F9612B;
            ;
            color: white;
            padding: 14px 16px 14px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;

        }

        .contact-btn:hover {
            background-color: #e55b25;
        }

        .menu-icon {
            display: none;
            /* hide*/
            width: 32px;
            height: 32px;
            cursor: pointer;
        }

        .close-btn {
            display: none;
        }


        /* ============ MOBILE ============ */
        @media (max-width: 1100px) {
            .menu {
                position: fixed;
                top: 0;
                right: 0;
                width: 300px;
                height: 100vh;
                background-color: #1d1d1d;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                padding-left: 40px;
                gap: 25px;
                transform: translateX(100%);
                /*animation*/
                transition: transform 0.4s ease-in-out;
                z-index: 99;
            }

            .menu a {
                color: white;
                font-size: 20px;
            }

            .menu.show {
                transform: translateX(0);
                /*animation*/
            }

            .menu-icon {
                display: block;
                position: absolute;
                right: 0;

            }

            .contact-btn {
                display: none;
            }

            .phone {
                margin-right: 30px;
            }



            /* 关闭按钮 X */
            .close-btn {
                position: absolute;
                top: 25px;
                right: 25px;
                font-size: 28px;
                color: white;
                cursor: pointer;
                font-weight: 300;
                display: block;
            }
        }

        @media (max-width: 750px) {


            .menu.show {
                top: 0;
                left: 0;
                width: 100%;
            }

            .right-section {
                display: none;
            }

            .close-btn {
                position: absolute;
                top: 25px;
                right: 60px;
                font-size: 28px;
                color: white;
                cursor: pointer;
                font-weight: 300;
            }
        }
    </style>
</head>

<body>
    <header>

        <div class="logo">
            <img src="image/logo.png" alt="ELEMENTRA">
        </div>


        <img src="image/hamburger.png" alt="menu" class="menu-icon" onclick="toggleMenu()">

        <nav class="menu" id="navMenu">
            <span class="close-btn" id="closeBtn" onclick="closeMenu()">&#10005;</span>
            <a href="#">Home</a>
            <a href="#" style="color: #F9612B;;">Services</a>
            <a href="#">Work</a>
            <a href="#">Project Details</a>
            <a href="#">Contact</a>
        </nav>


        <div class="right-section">
            <div class="phonepic">
                <img src="image/phone-call.png" alt="contact" height="20">
            </div>
            <div class="phone">555-123-4567</div>
            <a href="#" class="contact-btn">Contact</a>
        </div>
    </header>

    <script>
        const navMenu = document.getElementById("navMenu");
        const menuIcon = document.getElementById("menuIcon");

        function toggleMenu() {
            navMenu.classList.add("show");
        }

        function closeMenu() {
            navMenu.classList.remove("show");
        }
    </script>
</body>

</html>
